version: "1.0"
asvs_level: 1
features:
  - id: F-01
    name: Notification dispatch
    description: Send messages via SMS, email, push, and webhook relay
    boundaries:
      - sms-provider
      - email-relay
      - push-gateway
      - webhook-relay
    requirements:
      - id: F-01-R1
        title: External call timeout
        description: >
          Every outbound HTTP call to a third-party provider must include
          an explicit timeout so a hung upstream cannot block the worker
          indefinitely.
        asvs: []
        acceptance_criteria:
          - All requests.post / requests.get calls carry an explicit timeout parameter
          - A timeout triggers a logged, structured error with actor/action/target/outcome
        status: planned
      - id: F-01-R2
        title: Credential externalization
        description: >
          API keys for third-party providers must not appear in source code.
        asvs: []
        acceptance_criteria:
          - No API key literals in the integrations module
          - Keys are read from environment variables or a secrets manager
        status: planned
