name: securability-engineering-eval
description: Trigger evaluation for securable code generation.
skill: securability-engineering
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 0.7
    threshold: 0.8
    description: Did the skill trigger for security-sensitive code generation?
  - name: efficiency
    weight: 0.3
    threshold: 0.7
    description: Did the skill stay within behavior limits?
graders:
  - type: behavior
    name: token-budget
    config:
      max_tokens: 1200
tasks:
  - "tasks/*.yaml"
